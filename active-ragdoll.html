<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Archē — Active ragdoll laboratory</title><style>body{margin:0;background:#e6e3d7;color:#373d34;font:15px system-ui;touch-action:none}canvas{width:100%;height:65vh;display:block}section{padding:12px;display:flex;gap:8px;flex-wrap:wrap}button{padding:15px;border:1px solid #999;border-radius:8px;background:#faf8ee;font:inherit;touch-action:none}header{padding:12px}small{display:block}</style></head><body><header><b>Archē · Active ragdoll lab 0.2</b><small>Permanent physics · standing and balance</small></header><canvas id="c"></canvas><section><button id="left">Lean left</button><button id="right">Lean right</button><button id="push">Push body</button><button id="motor">Muscles on</button><button id="reset">Reset</button></section><section id="status"></section><script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script><script>
const {Engine,World,Bodies,Body,Constraint,Composite,Query}=Matter,canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let e,parts,joints,torso,feet,ground,lean=0,active=true;const W=640,H=400;
function reset(){e=Engine.create({positionIterations:12,velocityIterations:10,constraintIterations:8});parts=[];joints=[];ground=Bodies.rectangle(320,360,640,40,{isStatic:true,friction:1});World.add(e.world,ground);function part(x,y,w,h,color){const b=Bodies.rectangle(x,y,w,h,{density:.002,friction:.9,frictionStatic:1,frictionAir:.06,collisionFilter:{group:-1},chamfer:{radius:2}});b.color=color;parts.push(b);World.add(e.world,b);return b}function joint(a,b,x,y,target=0,k=.1){const j=Constraint.create({bodyA:a,bodyB:b,pointA:{x:x-a.position.x,y:y-a.position.y},pointB:{x:x-b.position.x,y:y-b.position.y},length:0,stiffness:.95,damping:.12});World.add(e.world,j);joints.push({a,b,target,k});return joints.at(-1)}torso=part(320,244,22,42,'#687c63');const head=part(320,213,19,21,'#c6a485');joint(torso,head,320,224,0,.12);feet=[];for(const side of [-1,1]){let x=320+side*10;const thigh=part(x,279,10,28,'#8c7860'),shin=part(x,307,9,28,'#79634e'),foot=part(x+side*6,334,27,12,'#514638');joint(torso,thigh,x,265,0,.22);joint(thigh,shin,x,293,0,.22);joint(shin,foot,x,326,0,.25);feet.push(foot);const arm=part(320+side*17,245,8,25,'#b99b7e'),fore=part(320+side*17,269,7,23,'#c6a485');joint(torso,arm,320+side*15,233,side*-.12,.045);joint(arm,fore,320+side*17,257,0,.04)}}reset();
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a)),clamp=(v,l,h)=>Math.max(l,Math.min(h,v));function motor(a,b,target,k){const err=wrap(target-(b.angle-a.angle)),rel=b.angularVelocity-a.angularVelocity;const inertia=1/(a.inverseInertia+b.inverseInertia);const torque=clamp(inertia*(err*k*.0008-rel*.0018),-.12,.12);b.torque+=torque;a.torque-=torque}
function step(){const contacts=feet.filter(f=>Query.collides(f,[ground]).length||f.bounds.max.y>339);if(active){for(const j of joints)motor(j.a,j.b,j.target,j.k);if(contacts.length){const support=contacts.reduce((s,f)=>s+f.position.x,0)/contacts.length;const mass=parts.reduce((s,b)=>s+b.mass,0),com=parts.reduce((s,b)=>s+b.position.x*b.mass,0)/mass;const target=clamp((com-support)*.025-lean*.10,-.25,.25);const torque=clamp(torso.inertia*(wrap(target-torso.angle)*.0009-torso.angularVelocity*.0025),-.15,.15);torso.torque+=torque;for(const f of contacts)f.torque-=torque/contacts.length;}}Engine.update(e,1000/120)}
function draw(){const d=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.fillStyle='#e6e3d7';ctx.fillRect(0,0,W,H);ctx.fillStyle='#a7a18a';ctx.fillRect(0,340,W,60);for(const b of parts){ctx.beginPath();b.vertices.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));ctx.closePath();ctx.fillStyle=b.color;ctx.fill();ctx.strokeStyle='#514c40';ctx.lineWidth=.6;ctx.stroke()}ctx.fillStyle='#6c775e';ctx.fillRect(torso.position.x-2,345,4,6);document.getElementById('status').textContent='Torso inclination: '+Math.round(wrap(torso.angle)*180/Math.PI)+'° · '+(active?'Active muscles':'Passive body')}
let last=performance.now(),acc=0;function loop(now){acc+=Math.min(50,now-last);last=now;while(acc>=1000/120){step();acc-=1000/120}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);for(const [id,v] of [['left',-1],['right',1]]){const b=document.getElementById(id);b.onpointerdown=ev=>{b.setPointerCapture(ev.pointerId);lean=v};b.onpointerup=b.onpointercancel=()=>lean=0}document.getElementById('push').onclick=()=>Body.applyForce(torso,{x:torso.position.x,y:torso.position.y-15},{x:.018,y:0});document.getElementById('motor').onclick=ev=>{active=!active;ev.target.textContent=active?'Muscles on':'Muscles off'};document.getElementById('reset').onclick=reset;
</script></body></html>
