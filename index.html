<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Archē</title><style>*{box-sizing:border-box}body{margin:0;background:#161b20;color:#eee;font:15px system-ui;overflow:hidden}canvas{display:block;touch-action:none;width:100vw;height:100dvh}header{position:fixed;top:env(safe-area-inset-top);left:16px;pointer-events:none}h1{font:32px Georgia;margin:12px 0 0}small{color:#aab5bf}nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:0;width:100%;display:flex;justify-content:center;gap:4px;flex-wrap:wrap}button{background:#29343d;color:white;border:1px solid #596873;border-radius:9px;padding:12px 7px;font:14px system-ui}nav{flex-direction:column;align-items:center;gap:6px;padding:0 8px}.tabs,.tools{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}.tabs button{padding:7px 16px;font-size:12px}.tabs button[aria-pressed=true]{background:#627c78;color:#fff}.tools button{padding:10px 9px}.tools button[hidden]{display:none}</style></head><body><canvas id="world"></canvas><header><h1>Archē</h1><small>v0.1.1 · Touch and drag matter</small></header><nav><div class="tabs" role="group" aria-label="Tool categories"><button data-tab="matter" aria-pressed="true">Matter</button><button data-tab="build" aria-pressed="false">Build</button><button data-tab="world" aria-pressed="false">World</button></div><div class="tools"><button id="box">Box</button><button id="ball">Ball</button><button id="gravity" aria-label="Change gravity">Gravity: 1g</button><button id="material">Wood</button><button id="size">Size: M</button><button id="cut">Cut: Off</button><button id="link">Link: Off</button><button id="motor">Motor: Off</button><button id="terrain">Terrain: Off</button><button id="pause">Pause</button><button id="reset">Reset</button></div></nav><script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script><script>const {Engine,Render,Runner,Bodies,Composite,Mouse,MouseConstraint,Body,Constraint,Query,Events}=Matter;const e=Engine.create();e.positionIterations=10;const c=document.querySelector('canvas');const r=Render.create({canvas:c,engine:e,options:{width:innerWidth,height:innerHeight,wireframes:false,background:'#161b20',pixelRatio:Math.min(devicePixelRatio,2)}});let walls=[];function bounds(){for(const wall of walls)Composite.remove(e.world,wall);let w=innerWidth,h=innerHeight;Render.setSize(r,w,h);walls=[Bodies.rectangle(w/2,h-110,w,24,{isStatic:true,render:{fillStyle:'#46535c'}}),Bodies.rectangle(-20,h/2,40,h*2,{isStatic:true}),Bodies.rectangle(w+20,h/2,40,h*2,{isStatic:true}),Bodies.rectangle(w/2,-20,w,40,{isStatic:true})];Composite.add(e.world,walls)}bounds();addEventListener('resize',bounds);const materials=[{name:'Wood',density:.0007,friction:.5,restitution:.25,color:'#d5a86e'},{name:'Rubber',density:.0011,friction:.85,restitution:.85,color:'#829d9a'},{name:'Stone',density:.0026,friction:.7,restitution:.1,color:'#a6a5c8'},{name:'Steel',density:.0078,friction:.3,restitution:.35,color:'#b8c3a0'}];let materialIndex=0;document.querySelector('#material').onclick=function(){materialIndex=(materialIndex+1)%materials.length;this.textContent=materials[materialIndex].name};const sizes=[12,20,34];let sizeIndex=1;document.querySelector('#size').onclick=function(){sizeIndex=(sizeIndex+1)%sizes.length;this.textContent='Size: '+['S','M','L'][sizeIndex]};function spawn(ball,x=innerWidth*(.25+Math.random()*.5),y=110){if(Composite.allBodies(e.world).length>100)return;const m=materials[materialIndex];let o={density:m.density,friction:m.friction,restitution:m.restitution,render:{fillStyle:m.color}};const radius=sizes[sizeIndex];Composite.add(e.world,ball?Bodies.circle(x,y,radius,o):Bodies.rectangle(x,y,2*radius,2*radius,o))}const mouse=Mouse.create(c);mouse.pixelRatio=r.options.pixelRatio;const mc=MouseConstraint.create(e,{mouse,constraint:{stiffness:.18,render:{visible:false}}});Composite.add(e.world,mc);r.mouse=mouse;let linkMode=0,first=null;const links=[];const terrain=[];let terrainMode=0,terrainStart=null;const terrainButton=document.querySelector('#terrain');function terrainCancel(){terrainStart=null}terrainButton.onclick=()=>{stopCut();clearSelection();terrainCancel();linkMode=0;motorMode=0;linkButton.textContent='Link: Off';motorButton.textContent='Motor: Off';terrainMode=(terrainMode+1)%3;terrainButton.textContent=['Terrain: Off','Terrain: Build','Terrain: Erase'][terrainMode];mc.collisionFilter.mask=terrainMode?0:0xFFFFFFFF};Events.on(r,'afterRender',()=>{if(!terrainStart)return;const ctx=r.context;ctx.save();ctx.strokeStyle='#f0d7a0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(terrainStart.x,terrainStart.y,6,0,Math.PI*2);ctx.stroke();ctx.restore()});const motors=new Map();let motorMode=0;const motorButton=document.querySelector('#motor');motorButton.onclick=()=>{stopCut();terrainMode=0;terrainCancel();terrainButton.textContent='Terrain: Off';clearSelection();linkMode=0;linkButton.textContent='Link: Off';motorMode=(motorMode+1)%4;motorButton.textContent=['Motor: Off','Motor: CW','Motor: CCW','Motor: Clear'][motorMode];mc.collisionFilter.mask=motorMode?0:0xFFFFFFFF};Events.on(e,'beforeUpdate',()=>{for(const [body,target] of motors){const error=target-body.angularVelocity;body.torque+=Math.max(-.002,Math.min(.002,error*.012))*body.inertia;Matter.Sleeping.set(body,false)}});const linkButton=document.querySelector('#link');function clearSelection(){if(first){first.render.strokeStyle=first.plugin.oldStroke;first.render.lineWidth=first.plugin.oldWidth;first=null}}linkButton.onclick=()=>{stopCut();terrainMode=0;terrainCancel();terrainButton.textContent='Terrain: Off';motorMode=0;motorButton.textContent='Motor: Off';clearSelection();linkMode=(linkMode+1)%4;linkButton.textContent=['Link: Off','Link: Rod','Link: Spring','Link: Anchor'][linkMode];mc.collisionFilter.mask=linkMode?0:0xFFFFFFFF};Events.on(mc,'mousedown',()=>{if(terrainMode){const p={x:mouse.position.x,y:mouse.position.y};if(terrainMode===2){const hit=Query.point(terrain,p)[0];if(hit){Composite.remove(e.world,hit);terrain.splice(terrain.indexOf(hit),1)}return}if(!terrainStart){terrainStart=p;return}const dx=p.x-terrainStart.x,dy=p.y-terrainStart.y,len=Math.hypot(dx,dy);if(len>=20&&terrain.length<40){const platform=Bodies.rectangle((p.x+terrainStart.x)/2,(p.y+terrainStart.y)/2,len,14,{isStatic:true,angle:Math.atan2(dy,dx),friction:.8,render:{fillStyle:'#78838a'}});terrain.push(platform);Composite.add(e.world,platform)}terrainCancel();return}if(!linkMode&&!motorMode)return;const hit=Query.point(Composite.allBodies(e.world).filter(b=>!b.isStatic),mouse.position)[0];if(motorMode){if(hit){if(motorMode===3){motors.delete(hit);hit.render.strokeStyle=hit.plugin.motorStroke;hit.render.lineWidth=hit.plugin.motorWidth}else{if(!motors.has(hit)){hit.plugin.motorStroke=hit.render.strokeStyle;hit.plugin.motorWidth=hit.render.lineWidth}motors.set(hit,motorMode===1?.12:-.12);hit.render.strokeStyle='#e8b45f';hit.render.lineWidth=3}}return}if(linkMode===3){if(!first){if(hit){first=hit;hit.plugin.oldStroke=hit.render.strokeStyle;hit.plugin.oldWidth=hit.render.lineWidth;hit.render.strokeStyle='#fff';hit.render.lineWidth=3}return}if(hit){clearSelection();return}if(links.length<80){const joint=Constraint.create({bodyB:first,pointA:{x:mouse.position.x,y:mouse.position.y},stiffness:.95,damping:.02,render:{type:'line',strokeStyle:'#d7c9a6',lineWidth:2,anchors:true}});links.push(joint);Composite.add(e.world,joint)}clearSelection();return}if(!hit){clearSelection();return}if(!first){first=hit;hit.plugin.oldStroke=hit.render.strokeStyle;hit.plugin.oldWidth=hit.render.lineWidth;hit.render.strokeStyle='#fff';hit.render.lineWidth=3;return}if(hit===first){clearSelection();return}if(links.length<80){const joint=Constraint.create({bodyA:first,bodyB:hit,stiffness:linkMode===1?.95:.035,damping:linkMode===1?.1:.08,render:{type:linkMode===1?'line':'spring',strokeStyle:'#d7c9a6',lineWidth:2,anchors:true}});links.push(joint);Composite.add(e.world,joint)}clearSelection()});const gravityModes=[{label:'1g',value:1},{label:'Moon',value:0.165},{label:'Zero',value:0},{label:'Reverse',value:-1}];let gravityIndex=0;document.querySelector('#gravity').onclick=function(){gravityIndex=(gravityIndex+1)%gravityModes.length;const mode=gravityModes[gravityIndex];e.gravity.y=mode.value;this.textContent='Gravity: '+mode.label;for(const body of Composite.allBodies(e.world))if(!body.isStatic)Matter.Sleeping.set(body,false)};const runner=Runner.create();Runner.run(runner,e);Render.run(r);document.querySelector('#box').onclick=()=>spawn(false);document.querySelector('#ball').onclick=()=>spawn(true);document.querySelector('#pause').onclick=function(){runner.enabled=!runner.enabled;this.textContent=runner.enabled?'Pause':'Resume'};document.querySelector('#reset').onclick=()=>{stopCut();clearSelection();for(const joint of links)Composite.remove(e.world,joint);links.length=0;motors.clear();terrainCancel();for(const platform of terrain)Composite.remove(e.world,platform);terrain.length=0;for(const b of Composite.allBodies(e.world))if(!b.isStatic)Composite.remove(e.world,b);for(let i=0;i<5;i++)spawn(i%2===0,innerWidth/2+(i-2)*35,130+i*45)};const cutButton=document.querySelector('#cut');let cutting=false,cutStart=null,cutEnd=null;function stopCut(){cutting=false;cutStart=cutEnd=null;cutButton.textContent='Cut: Off'}cutButton.onclick=()=>{if(cutting){stopCut();mc.collisionFilter.mask=0xFFFFFFFF;return}clearSelection();terrainCancel();linkMode=motorMode=terrainMode=0;linkButton.textContent='Link: Off';motorButton.textContent='Motor: Off';terrainButton.textContent='Terrain: Off';cutting=true;cutButton.textContent='Cut: On';mc.collisionFilter.mask=0};function clipPoly(v,a,b,sign){const side=p=>sign*((b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x));const out=[];for(let i=0;i<v.length;i++){const p=v[i],q=v[(i+1)%v.length],u=side(p),w=side(q);if(u>=0)out.push({x:p.x,y:p.y});if((u>0&&w<0)||(u<0&&w>0)){const t=u/(u-w);out.push({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t})}}return out}function polygonBody(v,o){const p=Matter.Vertices.centre(v);return Bodies.fromVertices(p.x,p.y,[v],o,false,0,0,0)}function cutLine(a,b){if(Math.hypot(b.x-a.x,b.y-a.y)<12)return;for(const old of Composite.allBodies(e.world).slice()){if(old.isStatic||old.parts.length>1||motors.has(old)||links.some(j=>j.bodyA===old||j.bodyB===old))continue;if(Composite.allBodies(e.world).length>=100)break;const dx=b.x-a.x,dy=b.y-a.y;const v=old.vertices;const cross=p=>dx*(p.y-a.y)-dy*(p.x-a.x);const hits=[];for(let i=0;i<v.length;i++){const p=v[i],q=v[(i+1)%v.length],u=cross(p),w=cross(q);if(u*w<0){const t=u/(u-w),x=p.x+(q.x-p.x)*t,y=p.y+(q.y-p.y)*t;hits.push(((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy))}}if(hits.length<2||hits.some(t=>t<0||t>1))continue;const polys=[clipPoly(v,a,b,1),clipPoly(v,a,b,-1)];if(polys.some(p=>p.length<3||Matter.Vertices.area(p)<35))continue;const parts=polys.map(p=>polygonBody(p,{density:old.density,friction:old.friction,restitution:old.restitution,render:{fillStyle:old.render.fillStyle}}));const total=parts.reduce((n,p)=>n+p.mass,0);for(const p of parts){Body.setMass(p,p.mass*old.mass/total);const x=p.position.x-old.position.x,y=p.position.y-old.position.y;Body.setVelocity(p,{x:old.velocity.x-old.angularVelocity*y,y:old.velocity.y+old.angularVelocity*x});Body.setAngularVelocity(p,old.angularVelocity)}Composite.remove(e.world,old);Composite.add(e.world,parts)}saveWorld()}function cutPoint(ev){const rect=c.getBoundingClientRect();return{x:(ev.clientX-rect.left)*r.options.width/rect.width,y:(ev.clientY-rect.top)*r.options.height/rect.height}}c.addEventListener('pointerdown',ev=>{if(!cutting)return;cutStart=cutEnd=cutPoint(ev);c.setPointerCapture(ev.pointerId)});c.addEventListener('pointermove',ev=>{if(cutting&&cutStart)cutEnd=cutPoint(ev)});c.addEventListener('pointerup',ev=>{if(cutting&&cutStart){cutLine(cutStart,cutPoint(ev));cutStart=cutEnd=null}});c.addEventListener('pointercancel',()=>{cutStart=cutEnd=null});Events.on(r,'afterRender',()=>{if(!cutStart||!cutEnd)return;const ctx=r.context;ctx.save();ctx.strokeStyle='#fff0b0';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(cutStart.x,cutStart.y);ctx.lineTo(cutEnd.x,cutEnd.y);ctx.stroke();ctx.restore()});document.querySelector('#reset').click();const groups={matter:['box','ball','material','size'],build:['cut','link','motor','terrain'],world:['gravity','pause','reset']};function selectTab(tab){if(tab!=='build'){stopCut();if(linkMode) {linkMode=0;linkButton.textContent='Link: Off';clearSelection()}if(motorMode){motorMode=0;motorButton.textContent='Motor: Off'}if(terrainMode){terrainMode=0;terrainCancel();terrainButton.textContent='Terrain: Off'}mc.collisionFilter.mask=0xFFFFFFFF}for(const [name,ids] of Object.entries(groups))for(const id of ids)document.getElementById(id).hidden=name!==tab;for(const button of document.querySelectorAll('[data-tab]'))button.setAttribute('aria-pressed',String(button.dataset.tab===tab))}for(const button of document.querySelectorAll('[data-tab]'))button.onclick=()=>selectTab(button.dataset.tab);selectTab('matter');const saveKey='arche-world-v1';function saveWorld(){try{const bodies=Composite.allBodies(e.world).filter(b=>!b.isStatic);const ids=new Map(bodies.map((b,i)=>[b,i]));localStorage.setItem(saveKey,JSON.stringify({bodies:bodies.map(b=>({x:b.position.x,y:b.position.y,angle:b.angle,v:b.velocity,av:b.angularVelocity,vertices:b.circleRadius?null:b.vertices.map(p=>({x:p.x,y:p.y})),mass:b.mass,r:b.circleRadius||0,w:b.circleRadius?0:Math.sqrt(b.area),density:b.density,friction:b.friction,restitution:b.restitution,color:b.render.fillStyle})),terrain:terrain.map(b=>({x:b.position.x,y:b.position.y,angle:b.angle,w:b.area/14})),links:links.map(j=>({a:ids.get(j.bodyA)??null,b:ids.get(j.bodyB)??null,pointA:j.pointA,pointB:j.pointB,length:j.length,stiffness:j.stiffness,damping:j.damping,type:j.render.type})),motors:[...motors].map(([b,v])=>[ids.get(b),v]),gravityIndex,materialIndex,sizeIndex}))}catch(err){console.warn('World save unavailable',err)}}function restoreWorld(){try{const raw=localStorage.getItem(saveKey);if(!raw)return;const d=JSON.parse(raw);if(!Array.isArray(d.bodies)||!Array.isArray(d.terrain)||!Array.isArray(d.links)||!Array.isArray(d.motors))return;const bs=d.bodies.slice(0,100).map(q=>{const o={density:q.density,friction:q.friction,restitution:q.restitution,angle:q.angle,render:{fillStyle:q.color}};const b=q.vertices?polygonBody(q.vertices,{...o,angle:0}):q.r?Bodies.circle(q.x,q.y,q.r,o):Bodies.rectangle(q.x,q.y,q.w,q.w,o);if(q.mass>0)Body.setMass(b,q.mass);Body.setVelocity(b,q.v);Body.setAngularVelocity(b,q.av);return b});const ts=d.terrain.slice(0,40).map(q=>Bodies.rectangle(q.x,q.y,q.w,14,{isStatic:true,angle:q.angle,friction:.8,render:{fillStyle:'#78838a'}}));const js=d.links.slice(0,80).filter(q=>bs[q.b]&& (q.a===null||bs[q.a])).map(q=>Constraint.create({bodyA:q.a===null?undefined:bs[q.a],bodyB:bs[q.b],pointA:q.pointA,pointB:q.pointB,length:q.length,stiffness:q.stiffness,damping:q.damping,render:{type:q.type,strokeStyle:'#d7c9a6',lineWidth:2,anchors:true}}));for(const b of Composite.allBodies(e.world))if(!b.isStatic)Composite.remove(e.world,b);Composite.add(e.world,[...bs,...ts,...js]);terrain.push(...ts);links.push(...js);for(const [i,v] of d.motors)if(bs[i]){motors.set(bs[i],v);bs[i].plugin.motorStroke=bs[i].render.strokeStyle;bs[i].plugin.motorWidth=bs[i].render.lineWidth;bs[i].render.strokeStyle='#e8b45f';bs[i].render.lineWidth=3}if(gravityModes[d.gravityIndex]){gravityIndex=d.gravityIndex;e.gravity.y=gravityModes[gravityIndex].value;document.querySelector('#gravity').textContent='Gravity: '+gravityModes[gravityIndex].label}if(materials[d.materialIndex]){materialIndex=d.materialIndex;document.querySelector('#material').textContent=materials[materialIndex].name}if(sizes[d.sizeIndex]){sizeIndex=d.sizeIndex;document.querySelector('#size').textContent='Size: '+['S','M','L'][sizeIndex]}}catch(err){console.warn('World restore unavailable',err)}}restoreWorld();setInterval(saveWorld,2000);addEventListener('pagehide',saveWorld);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveWorld()});</script></body></html>
