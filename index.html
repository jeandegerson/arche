 for(let x=100;x<worldWidth-100;x+=210){
  const sample=archeWorld.sample(x);
  if(sample.wet||sample.frozen||landscapeNoise(x+2419)>=(density[sample.biome]||0))continue;
  const id='surface-'+x;
  const size=landscapeNoise(x+2420)<.48?'large':'small';
  stoneDeposits.set(id,{x,route:'surface',size,shape:landscapeNoise(x+2421)});
  if(size==='large'){
   for(const offset of [-34,34,58]){
    const at=x+offset,ground=archeWorld.sample(at);
    if(!ground.wet&&!ground.frozen)stoneDeposits.set('slab-'+at,{
     x:at,route:'surface',size:'small',flat:true,shape:landscapeNoise(at+2480)
    });
   }
  }
 }
 for(const cave of caves){
  for(let x=cave.left+190;x<cave.right-80;x+=124){
   const room=physicalGeometry.walkingRegion(x,cave.id);
   if(!Number.isFinite(room.top)||room.bottom-room.top<60||landscapeNoise(x+2412)<.20)continue;
   const id=cave.id+'-stone-'+x;
   stoneDeposits.set(id,{x,route:cave.id,size:landscapeNoise(x+2413)<.6?'large':'small',shape:landscapeNoise(x+2421)});
  }
 }

function loadStones(records){

  if(!Number.isFinite(q?.x)||q.x<12||q.x>worldWidth-12||q.size!=='small'||
   !Number.isFinite(q.shape)||q.shape<0||q.shape>1||
   (q.route!=='surface'&&!caveById(q.route)))continue;
  const stone={...q};
  if(!stone.owner||!Number.isFinite(stone.until)||stone.until<=Date.now())stone.owner=null;
  if(stone.owner===woodOwner){

   else heldStone=id;

 }
 for(const [id,stone] of stoneChanges){
  if(!stoneDeposits.has(id)&&!stone.removed&&!stone.footing&&!(stone.owner&&stone.until>Date.now()))yield [id,stone];
