<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Archē</title><style>*{box-sizing:border-box}body{margin:0;background:#161b20;color:#eee;font:15px system-ui;overflow:hidden}canvas{display:block;touch-action:none;width:100vw;height:100dvh}header{position:fixed;top:env(safe-area-inset-top);left:16px;pointer-events:none}h1{font:32px Georgia;margin:12px 0 0}small{color:#aab5bf}nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:0;width:100%;display:flex;justify-content:center;gap:4px;flex-wrap:wrap}button{background:#29343d;color:white;border:1px solid #596873;border-radius:9px;padding:12px 7px;font:14px system-ui}</style></head><body><canvas id="world"></canvas><header><h1>Archē</h1><small>v0.0.7 · Touch and drag matter</small></header><nav><button id="box">Box</button><button id="ball">Ball</button><button id="gravity" aria-label="Change gravity">Gravity: 1g</button><button id="material">Wood</button><button id="size">Size: M</button><button id="link">Link: Off</button><button id="motor">Motor: Off</button><button id="pause">Pause</button><button id="reset">Reset</button></nav><script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script><script>const {Engine,Render,Runner,Bodies,Composite,Mouse,MouseConstraint,Body,Constraint,Query,Events}=Matter;const e=Engine.create();e.positionIterations=10;const c=document.querySelector('canvas');const r=Render.create({canvas:c,engine:e,options:{width:innerWidth,height:innerHeight,wireframes:false,background:'#161b20',pixelRatio:Math.min(devicePixelRatio,2)}});let walls=[];function bounds(){for(const wall of walls)Composite.remove(e.world,wall);let w=innerWidth,h=innerHeight;Render.setSize(r,w,h);walls=[Bodies.rectangle(w/2,h-75,w,24,{isStatic:true,render:{fillStyle:'#46535c'}}),Bodies.rectangle(-20,h/2,40,h*2,{isStatic:true}),Bodies.rectangle(w+20,h/2,40,h*2,{isStatic:true}),Bodies.rectangle(w/2,-20,w,40,{isStatic:true})];Composite.add(e.world,walls)}bounds();addEventListener('resize',bounds);const materials=[{name:'Wood',density:.0007,friction:.5,restitution:.25,color:'#d5a86e'},{name:'Rubber',density:.0011,friction:.85,restitution:.85,color:'#829d9a'},{name:'Stone',density:.0026,friction:.7,restitution:.1,color:'#a6a5c8'},{name:'Steel',density:.0078,friction:.3,restitution:.35,color:'#b8c3a0'}];let materialIndex=0;document.querySelector('#material').onclick=function(){materialIndex=(materialIndex+1)%materials.length;this.textContent=materials[materialIndex].name};const sizes=[12,20,34];let sizeIndex=1;document.querySelector('#size').onclick=function(){sizeIndex=(sizeIndex+1)%sizes.length;this.textContent='Size: '+['S','M','L'][sizeIndex]};function spawn(ball,x=innerWidth*(.25+Math.random()*.5),y=110){if(Composite.allBodies(e.world).length>100)return;const m=materials[materialIndex];let o={density:m.density,friction:m.friction,restitution:m.restitution,render:{fillStyle:m.color}};const radius=sizes[sizeIndex];Composite.add(e.world,ball?Bodies.circle(x,y,radius,o):Bodies.rectangle(x,y,2*radius,2*radius,o))}const mouse=Mouse.create(c);mouse.pixelRatio=r.options.pixelRatio;const mc=MouseConstraint.create(e,{mouse,constraint:{stiffness:.18,render:{visible:false}}});Composite.add(e.world,mc);r.mouse=mouse;let linkMode=0,first=null;const links=[];const motors=new Map();let motorMode=0;const motorButton=document.querySelector('#motor');motorButton.onclick=()=>{clearSelection();linkMode=0;linkButton.textContent='Link: Off';motorMode=(motorMode+1)%4;motorButton.textContent=['Motor: Off','Motor: CW','Motor: CCW','Motor: Clear'][motorMode];mc.collisionFilter.mask=motorMode?0:0xFFFFFFFF};Events.on(e,'beforeUpdate',()=>{for(const [body,target] of motors){const error=target-body.angularVelocity;body.torque+=Math.max(-.002,Math.min(.002,error*.012))*body.inertia;Matter.Sleeping.set(body,false)}});const linkButton=document.querySelector('#link');function clearSelection(){if(first){first.render.strokeStyle=first.plugin.oldStroke;first.render.lineWidth=first.plugin.oldWidth;first=null}}linkButton.onclick=()=>{motorMode=0;motorButton.textContent='Motor: Off';clearSelection();linkMode=(linkMode+1)%4;linkButton.textContent=['Link: Off','Link: Rod','Link: Spring','Link: Anchor'][linkMode];mc.collisionFilter.mask=linkMode?0:0xFFFFFFFF};Events.on(mc,'mousedown',()=>{if(!linkMode&&!motorMode)return;const hit=Query.point(Composite.allBodies(e.world).filter(b=>!b.isStatic),mouse.position)[0];if(motorMode){if(hit){if(motorMode===3){motors.delete(hit);hit.render.strokeStyle=hit.plugin.motorStroke;hit.render.lineWidth=hit.plugin.motorWidth}else{if(!motors.has(hit)){hit.plugin.motorStroke=hit.render.strokeStyle;hit.plugin.motorWidth=hit.render.lineWidth}motors.set(hit,motorMode===1?.12:-.12);hit.render.strokeStyle='#e8b45f';hit.render.lineWidth=3}}return}if(linkMode===3){if(!first){if(hit){first=hit;hit.plugin.oldStroke=hit.render.strokeStyle;hit.plugin.oldWidth=hit.render.lineWidth;hit.render.strokeStyle='#fff';hit.render.lineWidth=3}return}if(hit){clearSelection();return}if(links.length<80){const joint=Constraint.create({bodyB:first,pointA:{x:mouse.position.x,y:mouse.position.y},stiffness:.95,damping:.02,render:{type:'line',strokeStyle:'#d7c9a6',lineWidth:2,anchors:true}});links.push(joint);Composite.add(e.world,joint)}clearSelection();return}if(!hit){clearSelection();return}if(!first){first=hit;hit.plugin.oldStroke=hit.render.strokeStyle;hit.plugin.oldWidth=hit.render.lineWidth;hit.render.strokeStyle='#fff';hit.render.lineWidth=3;return}if(hit===first){clearSelection();return}if(links.length<80){const joint=Constraint.create({bodyA:first,bodyB:hit,stiffness:linkMode===1?.95:.035,damping:linkMode===1?.1:.08,render:{type:linkMode===1?'line':'spring',strokeStyle:'#d7c9a6',lineWidth:2,anchors:true}});links.push(joint);Composite.add(e.world,joint)}clearSelection()});const gravityModes=[{label:'1g',value:1},{label:'Moon',value:0.165},{label:'Zero',value:0},{label:'Reverse',value:-1}];let gravityIndex=0;document.querySelector('#gravity').onclick=function(){gravityIndex=(gravityIndex+1)%gravityModes.length;const mode=gravityModes[gravityIndex];e.gravity.y=mode.value;this.textContent='Gravity: '+mode.label;for(const body of Composite.allBodies(e.world))if(!body.isStatic)Matter.Sleeping.set(body,false)};const runner=Runner.create();Runner.run(runner,e);Render.run(r);document.querySelector('#box').onclick=()=>spawn(false);document.querySelector('#ball').onclick=()=>spawn(true);document.querySelector('#pause').onclick=function(){runner.enabled=!runner.enabled;this.textContent=runner.enabled?'Pause':'Resume'};document.querySelector('#reset').onclick=()=>{clearSelection();for(const joint of links)Composite.remove(e.world,joint);links.length=0;motors.clear();for(const b of Composite.allBodies(e.world))if(!b.isStatic)Composite.remove(e.world,b);for(let i=0;i<5;i++)spawn(i%2===0,innerWidth/2+(i-2)*35,130+i*45)};document.querySelector('#reset').click();</script></body></html>
