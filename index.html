<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Archē</title><style>*{box-sizing:border-box}body{margin:0;background:#161b20;color:#eee;font:15px system-ui;overflow:hidden}canvas{display:block;touch-action:none;width:100vw;height:100dvh}header{position:fixed;top:env(safe-area-inset-top);left:16px;pointer-events:none}h1{font:32px Georgia;margin:12px 0 0}small{color:#aab5bf}nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:0;width:100%;display:flex;justify-content:center;gap:4px;flex-wrap:wrap}button{background:#29343d;color:white;border:1px solid #596873;border-radius:9px;padding:12px 7px;font:14px system-ui}</style></head><body><canvas id="world"></canvas><header><h1>Archē</h1><small>v0.0.2 · Touch and drag matter</small></header><nav><button id="box">Box</button><button id="ball">Ball</button><button id="gravity" aria-label="Change gravity">Gravity: 1g</button><button id="pause">Pause</button><button id="reset">Reset</button></nav><script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script><script>const {Engine,Render,Runner,Bodies,Composite,Mouse,MouseConstraint,Body}=Matter;const e=Engine.create();e.positionIterations=10;const c=document.querySelector('canvas');const r=Render.create({canvas:c,engine:e,options:{width:innerWidth,height:innerHeight,wireframes:false,background:'#161b20',pixelRatio:Math.min(devicePixelRatio,2)}});let walls=[];function bounds(){for(const wall of walls)Composite.remove(e.world,wall);let w=innerWidth,h=innerHeight;Render.setSize(r,w,h);walls=[Bodies.rectangle(w/2,h-75,w,24,{isStatic:true,render:{fillStyle:'#46535c'}}),Bodies.rectangle(-20,h/2,40,h*2,{isStatic:true}),Bodies.rectangle(w+20,h/2,40,h*2,{isStatic:true}),Bodies.rectangle(w/2,-20,w,40,{isStatic:true})];Composite.add(e.world,walls)}bounds();addEventListener('resize',bounds);const colors=['#d5a86e','#829d9a','#a6a5c8','#b8c3a0'];function spawn(ball,x=innerWidth*(.25+Math.random()*.5),y=110){if(Composite.allBodies(e.world).length>100)return;let o={restitution:.35,friction:.5,render:{fillStyle:colors[Math.floor(Math.random()*colors.length)]}};Composite.add(e.world,ball?Bodies.circle(x,y,20,o):Bodies.rectangle(x,y,40,40,o))}const mouse=Mouse.create(c);mouse.pixelRatio=r.options.pixelRatio;const mc=MouseConstraint.create(e,{mouse,constraint:{stiffness:.18,render:{visible:false}}});Composite.add(e.world,mc);r.mouse=mouse;const gravityModes=[{label:'1g',value:1},{label:'Moon',value:0.165},{label:'Zero',value:0},{label:'Reverse',value:-1}];let gravityIndex=0;document.querySelector('#gravity').onclick=function(){gravityIndex=(gravityIndex+1)%gravityModes.length;const mode=gravityModes[gravityIndex];e.gravity.y=mode.value;this.textContent='Gravity: '+mode.label;for(const body of Composite.allBodies(e.world))if(!body.isStatic)Matter.Sleeping.set(body,false)};const runner=Runner.create();Runner.run(runner,e);Render.run(r);document.querySelector('#box').onclick=()=>spawn(false);document.querySelector('#ball').onclick=()=>spawn(true);document.querySelector('#pause').onclick=function(){runner.enabled=!runner.enabled;this.textContent=runner.enabled?'Pause':'Resume'};document.querySelector('#reset').onclick=()=>{for(const b of Composite.allBodies(e.world))if(!b.isStatic)Composite.remove(e.world,b);for(let i=0;i<5;i++)spawn(i%2===0,innerWidth/2+(i-2)*35,130+i*45)};document.querySelector('#reset').click();</script></body></html>
