<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archē geological laboratory</title><style>body{background:#202624;color:#e5dfd2;font:16px system-ui;margin:16px}canvas{width:100%;min-height:160px;height:auto;image-rendering:auto;background:#a9b9bd}input,button{font:inherit;padding:8px}pre{white-space:pre-wrap}</style><h1>Geological laboratory</h1><p>Experimental field — not the shared world.</p><label>Seed <input id="seed" type="number" value="42"></label> <label>Rock <select id="regime"><option value="limestone">Limestone</option><option value="sandstone">Sandstone</option><option value="fractured">Fractured rock</option></select></label> <label>Geological age <select id="maturity"><option value="1">Young</option><option value="2" selected>Mature</option><option value="4">Old</option></select></label> <button id="run">Generate</button> <label><input type="checkbox" id="edges" checked> Boundaries</label><label><input type="checkbox" id="sections"> Vertical sections</label><label>View <select id="zoom"><option value="1">Overview</option><option value="2" selected>Explore 2×</option><option value="3">Explore 3×</option></select></label><canvas id="view" width="960" height="400"></canvas><div style="display:flex;flex-wrap:wrap;gap:10px;touch-action:none;margin:12px 0"><button id="left">◀</button><button id="right">▶</button><button id="jump">Jump</button><button id="crouch">Crouch</button><button id="climb">Climb</button><button id="reset">Respawn</button></div><pre id="stats"></pre><script>// Deterministic experimental geological field; independent of live world.
(function(root){
function generate({width=240,height=100,seed=42,surface=x=>20+8*Math.sin(x/30),regime='limestone',maturity=2}={}){
 const profiles={limestone:{bed:.45,fracture:.65,down:.48,erosion:1},sandstone:{bed:.85,fracture:.25,down:.18,erosion:.75},fractured:{bed:.18,fracture:.95,down:.72,erosion:.85}};const p=profiles[regime]||profiles.limestone;
 const n=width*height,solid=new Uint8Array(n),weak=new Float32Array(n),flow=new Float32Array(n);
 const hash=(x,y)=>{let v=Math.sin(x*127.1+y*311.7+seed*74.7)*43758.5453;return v-Math.floor(v)};
 const idx=(x,y)=>y*width+x;
 for(let y=0;y<height;y++)for(let x=0;x<width;x++){
 const i=idx(x,y);solid[i]=+(y>=surface(x));
 const bed=Math.abs(Math.sin((y+5*Math.sin(x/25))/6));
 const fracture=Math.min(Math.abs(Math.sin((x+y*.65+4*Math.sin(y/9))/13)),Math.abs(Math.sin((x-y*.38)/19)));
 weak[i]=.15+p.bed*Math.exp(-bed*8)+p.fracture*Math.exp(-fracture*12);
 }
 // Recharge traces compete for permeable routes; accumulated flow enlarges rock.
 for(let k=0;k<width*12;k++){
 let x=1+Math.floor(hash(k,1)*(width-2)),y=Math.ceil(surface(x)),heading=hash(k,2)<.5?-1:1;
 for(let t=0;t<height*2&&y<height-3&&x>1&&x<width-2;t++){
 flow[idx(x,y)]+=1;
 let best=null;
 for(const [dx,dy] of [[-1,0],[1,0],[-1,1],[0,1],[1,1]]){
 const a=x+dx,b=y+dy,i=idx(a,b);
 if(!solid[i])continue;
 const score=weak[i]*2+Math.log1p(flow[i])*.10+dy*p.down+dx*heading*.10+hash(k+t*7,a+b*width)*.55;
 if(!best||score>best.score)best={a,b,score};
 }
 if(!best)break;x=best.a;y=best.b;
 }
 }
 let peak=0;for(const v of flow)peak=Math.max(peak,v);
 for(let y=1;y<height-2;y++)for(let x=1;x<width-1;x++){
 const f=flow[idx(x,y)];if(f<Math.max(9,peak*.045))continue;
 const chamber=.55+.9*hash(Math.floor(x/24),Math.floor(y/18));
 const radius=Math.min(15,1+Math.floor(Math.sqrt(f)*.30*p.erosion*chamber*(.75+.25*maturity)));
 for(let dy=-radius;dy<=radius;dy++)for(let dx=-radius;dx<=radius;dx++){
 const a=x+dx,b=y+dy;if(a<1||a>=width-1||b<1||b>=height-2)continue;
 if(dx*dx+dy*dy<=radius*radius*(.65+.55*weak[idx(a,b)]))solid[idx(a,b)]=0;
 }
 }
 // Secondary circulation: widen existing conduits where nearby permeable rock receives flow.
 for(let pass=1;pass<maturity;pass++){
 const remove=[];
 for(let y=2;y<height-3;y++)for(let x=2;x<width-2;x++){
 const i=idx(x,y);if(!solid[i]||y<surface(x)+2)continue;
 let wet=0,open=0;
 for(const j of [i-1,i+1,i-width,i+width])if(!solid[j]){open++;wet+=flow[j]}
 if(open&&weak[i]>.42&&wet>peak*.018&&hash(x+pass*width,y)<Math.min(.85,weak[i]*.65))remove.push(i);
 }
 for(const i of remove){solid[i]=0;flow[i]=Math.max(flow[i],peak*.025)}
 }
 // Unsupported thin roof fragments fall into the first available space below.
 const debris=new Uint8Array(n);
 for(let pass=0;pass<3;pass++){
 const falling=[];
 for(let y=2;y<height-3;y++)for(let x=2;x<width-2;x++){
 const i=idx(x,y);
 if(!solid[i]||solid[i+width]||y<surface(x)+3)continue;
 if(solid[i-1]&&solid[i+1]||solid[i-width]&&solid[i-2*width])continue;
 if(hash(x+pass*width,y)>.55)continue;
 falling.push(i);
 }
 for(const i of falling){
 if(!solid[i]||solid[i+width])continue;
 let j=i+width;while(j+width<n&&!solid[j+width])j+=width;
 solid[i]=0;solid[j]=1;debris[j]=1;debris[i]=0;
 }
 }
 const seen=new Uint8Array(n),components=[];
 for(let y=0;y<height;y++)for(let x=0;x<width;x++){
 const i=idx(x,y);if(seen[i]||solid[i]||y<surface(x))continue;
 const queue=[i];seen[i]=1;let openings=new Set(),minX=x,maxX=x,minY=y,maxY=y;
 for(let j=0;j<queue.length;j++){
 const a=queue[j]%width,b=Math.floor(queue[j]/width);minX=Math.min(minX,a);maxX=Math.max(maxX,a);minY=Math.min(minY,b);maxY=Math.max(maxY,b);
 for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
 const c=a+dx,d=b+dy;if(c<0||c>=width||d<0||d>=height)continue;
 if(d<surface(c)){openings.add(c);continue}
 const z=idx(c,d);if(!seen[z]&&!solid[z]){seen[z]=1;queue.push(z)}
 }
 }
 if(queue.length>=8)components.push({area:queue.length,minX,maxX,minY,maxY,openingColumns:[...openings].sort((a,b)=>a-b)});
 }
 return {width,height,solid,weak,flow,debris,components,regime};
}
// Extract all solid/void interfaces from the same field using marching squares.
function contours(field){
 const {width:w,height:h,solid}=field,segments=[];
 for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++){
 const i=y*w+x,v=[solid[i],solid[i+1],solid[i+w+1],solid[i+w]],p=[[x,y],[x+1,y],[x+1,y+1],[x,y+1]];
 const alt=v[0]===v[2]&&v[1]===v[3]&&v[0]!==v[1]&&v[0]===1;
 for(const tri of alt?[[0,1,3],[1,2,3]]:[[0,1,2],[0,2,3]]){
 const hits=[];for(let j=0;j<3;j++){const a=tri[j],b=tri[(j+1)%3];if(v[a]!==v[b])hits.push([(p[a][0]+p[b][0])/2,(p[a][1]+p[b][1])/2]);}
 if(hits.length===2)segments.push(hits);
 }
 }
 return segments;
}
// Assemble boundary segments into continuous paths without inventing new geometry.
function boundaryPaths(field){
 const edges=contours(field),adj=new Map(),used=new Set(),paths=[];
 const key=p=>p.join(',');
 edges.forEach((e,i)=>e.forEach(p=>{const k=key(p);if(!adj.has(k))adj.set(k,[]);adj.get(k).push(i)}));
 function trace(i,start){const points=[start];let p=start;
 while(i!==undefined&&!used.has(i)){used.add(i);const e=edges[i];p=key(e[0])===key(p)?e[1]:e[0];points.push(p);i=adj.get(key(p)).find(j=>!used.has(j));}
 return {points,closed:key(points[0])===key(points.at(-1))};}
 for(const [k,ids] of adj)if(ids.length===1&&!used.has(ids[0]))paths.push(trace(ids[0],k.split(',').map(Number)));
 edges.forEach((e,i)=>{if(!used.has(i))paths.push(trace(i,e[0]))});
 return paths;
}
function physicalField(field){
 const paths=boundaryPaths(field);
 // Piecewise-linear occupancy on triangles matching marching-squares interfaces.
 const sample=(x,y)=>{if(y<0)return 0;if(x<0||x>=field.width||y>=field.height)return 1;return field.solid[y*field.width+x]};
 const isSolid=(x,y)=>{
 const a=Math.floor(x),b=Math.floor(y),u=x-a,v=y-b;
 const A=sample(a,b),B=sample(a+1,b),C=sample(a+1,b+1),D=sample(a,b+1);
 // Ambiguous squares keep diagonally touching solid cells disconnected.
 const alternate=A===C&&B===D&&A!==B?A===1:false;
 let value;
 if(alternate)value=u+v<=1?A+(B-A)*u+(D-A)*v:C+(D-C)*(1-u)+(B-C)*(1-v);
 else value=u>=v?A+(B-A)*u+(C-B)*v:A+(C-D)*u+(D-A)*v;
 return value>=.5;
 };
 const column=x=>{const a=Math.round(x),out=[];if(a<0||a>=field.width)return out;let start=null;
 for(let y=0;y<=field.height;y++){if(y<field.height&&!isSolid(a,y)){if(start===null)start=y-.5;}else if(start!==null){out.push({top:start,bottom:y-.5});start=null;}}return out;};
 return {paths,isSolid,column};
}
root.ArcheGeology={generate,contours,boundaryPaths,physicalField};
})(typeof globalThis!=='undefined'?globalThis:this);
</script><script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),seed=document.getElementById('seed'),edges=document.getElementById('edges');let f;const sections=document.getElementById('sections');
const terrainCache=document.createElement('canvas');terrainCache.width=960;terrainCache.height=400;let dirty=true;const zoom=document.getElementById('zoom');
function paintTerrain(ctx){const scale=4;ctx.fillStyle='#a9b9bd';ctx.fillRect(0,0,960,400);const geo=ArcheGeology.physicalField(f);const img=ctx.createImageData(960,400);for(let py=0;py<400;py++)for(let px=0;px<960;px++){const x=(px-2)/4,y=(py-2)/4,i=Math.max(0,Math.min(f.solid.length-1,Math.round(y)*f.width+Math.max(0,Math.min(f.width-1,Math.round(x))))),j=(py*960+px)*4;let rgb;if(geo.isSolid(x,y)){const v=Math.round(105+35*f.weak[i]);rgb=f.debris[i]?[195,157,115]:[v+18,v,v-17]}else rgb=y>=20+8*Math.sin(x/30)?[41,47,48]:[169,185,189];img.data[j]=rgb[0];img.data[j+1]=rgb[1];img.data[j+2]=rgb[2];img.data[j+3]=255}ctx.putImageData(img,0,0);if(edges.checked){ctx.strokeStyle='#d0bda0';ctx.lineWidth=1;ctx.beginPath();for(const path of ArcheGeology.boundaryPaths(f)){path.points.forEach((p,i)=>i?ctx.lineTo(p[0]*scale+2,p[1]*scale+2):ctx.moveTo(p[0]*scale+2,p[1]*scale+2));if(path.closed)ctx.closePath()}ctx.stroke()}if(sections.checked){const physical=ArcheGeology.physicalField(f);ctx.strokeStyle='#73d9dd';ctx.lineWidth=1;for(let x=8;x<f.width;x+=8)for(const q of physical.column(x).slice(1)){ctx.beginPath();ctx.moveTo(x*scale+2,q.top*scale+2);ctx.lineTo(x*scale+2,q.bottom*scale+2);ctx.stroke()}}}
function draw(){if(!f)return;if(dirty){paintTerrain(terrainCache.getContext('2d'));dirty=false}const z=Number(zoom.value),w=960/z,h=400/z,x=Math.max(0,Math.min(960-w,(player?.x||120)*4-w/2)),y=Math.max(0,Math.min(400-h,(player?.y||50)*4-h/2));ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(terrainCache,x,y,w,h,0,0,960,400);ctx.setTransform(z,0,0,z,-x*z,-y*z)}
function run(){try{f=ArcheGeology.generate({seed:Number(seed.value),regime:document.getElementById('regime').value,maturity:Number(document.getElementById('maturity').value)});spawn();dirty=true;draw();document.getElementById('stats').textContent=('Rock: '+f.regime+' | Debris cells: '+f.debris.reduce((a,b)=>a+b,0)+'\n')+f.components.map((c,i)=>'Formation '+(i+1)+': '+c.area+' cells; span '+(c.maxX-c.minX+1)+' × '+(c.maxY-c.minY+1)+'; '+(c.openingColumns.length?'surface-connected':'enclosed')).join('\n')}catch(e){document.getElementById('stats').textContent='Generation error: '+e.message;console.error(e)}}
let player,physical,keys={left:false,right:false,jump:false,crouch:false,climb:false},last=0;
function spawn(){physical=ArcheGeology.physicalField(f);let x=12;const q=physical.column(x)[0];player={x,y:q.bottom-2.4,vy:0,ground:false,half:2.2};}
function blocked(x,y,half=player.half){for(let dx=-.65;dx<=.66;dx+=.65)for(let i=0;i<=8;i++)if(physical.isSolid(x+dx,y-half+2*half*i/8))return true;return false}
function tick(t){const dt=Math.max(0,Math.min(2,(t-last)/16.67||1));last=t;if(player){
 const dir=Number(keys.right)-Number(keys.left),target=keys.crouch?1.25:2.2;
 const nextY=player.y+player.half-target;
 if(!blocked(player.x,nextY,target)){player.y=nextY;player.half=target}
 for(let k=0;k<4;k++){
 const d=dt/4,nx=player.x+dir*(keys.crouch?.36:.8)*d;
 const sideContact=side=>{let hits=0;for(const offset of [-.8,0,.8])if(physical.isSolid(player.x+side*1.15,player.y+offset))hits++;return hits>=2};const wall=sideContact(-1)||sideContact(1);
 if(keys.climb&&wall&&!blocked(player.x,player.y-.48*d)){player.y-=.48*d;player.vy=0;player.ground=false;continue}
 if(!blocked(nx,player.y))player.x=nx;
 else if(dir&&player.ground&&!blocked(player.x,player.y-.65)&&!blocked(nx,player.y-.65)){player.x=nx;player.y-=.65}
 if(keys.jump&&player.ground){player.vy=-1.65;player.ground=false;keys.jump=false}
 player.vy=Math.min(2,player.vy+.095*d);const ny=player.y+player.vy*d;
 if(!blocked(player.x,ny)){player.y=ny;player.ground=false}else{player.ground=player.vy>=0;player.vy=0}
 }
 draw();ctx.fillStyle='#e8b66f';ctx.fillRect((player.x-.65)*4+2,(player.y-player.half)*4+2,5.2,player.half*8)
 }requestAnimationFrame(tick)}
for(const k of ['left','right','jump','crouch','climb']){const b=document.getElementById(k);b.style.minWidth='64px';b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true};b.onpointerup=b.onpointercancel=()=>keys[k]=false}
const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',' ':'jump',ArrowDown:'crouch',c:'climb'};addEventListener('keydown',e=>{if(map[e.key]){e.preventDefault();keys[map[e.key]]=true}});addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=false});document.getElementById('reset').onclick=spawn;
document.getElementById('run').onclick=run;edges.onchange=sections.onchange=()=>{dirty=true;draw()};zoom.onchange=draw;run();requestAnimationFrame(tick);
</script></html>
