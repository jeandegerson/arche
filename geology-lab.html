<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archē geological laboratory</title><style>body{background:#202624;color:#e5dfd2;font:16px system-ui;margin:16px}canvas{width:100%;height:auto;image-rendering:auto;background:#a9b9bd}input,button{font:inherit;padding:8px}pre{white-space:pre-wrap}</style><h1>Geological laboratory</h1><p>Experimental field — not the shared world.</p><label>Seed <input id="seed" type="number" value="42"></label> <button id="run">Generate</button> <label><input type="checkbox" id="edges" checked> Boundaries</label><canvas id="view" width="960" height="400"></canvas><pre id="stats"></pre><script src="geology-experimental.js"></script><script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),seed=document.getElementById('seed'),edges=document.getElementById('edges');let f;
function draw(){const scale=4;ctx.fillStyle='#a9b9bd';ctx.fillRect(0,0,960,400);for(let y=0;y<f.height;y++)for(let x=0;x<f.width;x++){let i=y*f.width+x;if(f.solid[i]){let v=Math.round(105+35*f.weak[i]);ctx.fillStyle='rgb('+ (v+18)+','+v+','+(v-17)+')';ctx.fillRect(x*scale,y*scale,scale,scale)}else if(y>=20+8*Math.sin(x/30)){ctx.fillStyle='#292f30';ctx.fillRect(x*scale,y*scale,scale,scale)}}if(edges.checked){ctx.strokeStyle='#d0bda0';ctx.lineWidth=1;ctx.beginPath();for(const [a,b] of ArcheGeology.contours(f)){ctx.moveTo(a[0]*scale+2,a[1]*scale+2);ctx.lineTo(b[0]*scale+2,b[1]*scale+2)}ctx.stroke()}}
function run(){f=ArcheGeology.generate({seed:Number(seed.value)});draw();document.getElementById('stats').textContent=f.components.map((c,i)=>'Formation '+(i+1)+': '+c.area+' cells; span '+(c.maxX-c.minX+1)+' × '+(c.maxY-c.minY+1)+'; '+(c.openingColumns.length?'surface-connected':'enclosed')).join('\n')}
document.getElementById('run').onclick=run;edges.onchange=draw;run();
</script></html>
