<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archē geological laboratory</title><style>body{background:#202624;color:#e5dfd2;font:16px system-ui;margin:16px}canvas{width:100%;min-height:160px;height:auto;image-rendering:auto;background:#a9b9bd}input,button{font:inherit;padding:8px}pre{white-space:pre-wrap}</style><h1>Geological laboratory</h1><p>Experimental field — not the shared world.</p><label>Seed <input id="seed" type="number" value="42"></label> <label>Rock <select id="regime"><option value="auto" selected>Regional geology</option><option value="limestone">Limestone</option><option value="sandstone">Sandstone</option><option value="fractured">Fractured rock</option></select></label> <label>Landscape <select id="region"><option value="lab">Original laboratory</option><option value="6250">island (6250)</option><option value="16250">coast (16250)</option><option value="21250">marsh (21250)</option><option value="26750">meadow (26750)</option><option value="31000">woodland (31000)</option><option value="41000">conifer (41000)</option><option value="51000">alpine (51000)</option><option value="74750">steppe (74750)</option><option value="79750">arid (79750)</option><option value="84750">dunes (84750)</option><option value="88500">oasis (88500)</option><option value="98250">sandstone (98250)</option></select></label> <label>Geological age <select id="maturity"><option value="1">Young</option><option value="2" selected>Mature</option><option value="4">Old</option></select></label> <button id="run">Generate</button> <label><input type="checkbox" id="edges" checked> Boundaries</label><label><input type="checkbox" id="sections"> Vertical sections</label><label>View <select id="zoom"><option value="1">Overview</option><option value="2" selected>Explore 2×</option><option value="3">Explore 3×</option></select></label><label><input type="checkbox" id="strength"> Rock resistance</label><label><input type="checkbox" id="flow (function(root){
function generate({width=240,height=100,seed=42,surface=x=>20+8*Math.sin(x/30),regime='limestone',maturity=2,environment=()=>({recharge:1,vertical:1,solubility:1})}={}){

 const i=idx(x,y);solid[i]=+(y>=surface(x));
