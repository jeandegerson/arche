name: Browser tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm install --no-save --ignore-scripts playwright@1.51.1 matter-js@0.20.0
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          python3 -m http.server 8080 > /tmp/arche-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          node tests/smoke.cjs
