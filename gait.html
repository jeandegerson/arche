<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Archē — Locomotion laboratory</title><style>*{box-sizing:border-box}body{margin:0;background:#18232b;color:#e1dfcf;font:14px system-ui;touch-action:none}canvas{width:100%;height:100dvh;display:block}header{position:absolute;top:12px;left:14px;right:14px}h1{font:28px Georgia;margin:0 0 8px}button,select{background:#293941;color:inherit;border:1px solid #68766f;border-radius:8px;padding:10px}#pad{position:absolute;bottom:30px;left:24px;width:144px;height:144px;border:1px solid #89958c;border-radius:50%;background:#ffffff12;touch-action:none}#knob{position:absolute;left:48px;top:48px;width:48px;height:48px;border-radius:50%;background:#a3b3a4}#jump{position:absolute;bottom:50px;right:25px}#info{margin-top:8px;font:12px monospace}</style><canvas></canvas><header><h1>Archē · locomotion lab 0.13 · gait study</h1><select id="scene"><option>Flat ground</option><option>Gradual slope</option><option>Irregular steps</option><option>Concave terrain</option><option>Vertical face</option><option>Uneven descent</option></select> <button id="reset">Reset</button> <button id="slow">Slow</button> <button id="debug">Contacts</button><div id="info"></div></header><div id="pad"><div id="knob"></div></div><button id="jump" hidden>Jump</button><script>
const C=document.querySelector('canvas'),ctx=C.getContext('2d'),scene=document.querySelector('#scene'),info=document.querySelector('#info');let W,H,scale=1,cam=0,slow=false,debug=true,input={x:0,y:0},jump=false;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const profiles=[[[0,0],[1000,0]],[[0,0],[150,0],[450,-140],[1000,-140]],[[0,0],[150,0],[150,-12],[200,-12],[200,-30],[250,-30],[250,-48],[300,-48],[300,-70],[1000,-70]],[[0,-50],[130,-50],[220,0],[270,25],[350,-75],[430,-90],[1000,-90]],[[0,0],[210,0],[210,-150],[1000,-150]],[[0,-100],[150,-100],[220,-60],[260,-60],[310,-15],[350,-30],[430,0],[1000,0]]];let edges,b,limbs,clock=0;function reset(){edges=profiles[scene.selectedIndex].slice(1).map((p,i)=>{let a=profiles[scene.selectedIndex][i],dx=p[0]-a[0],dy=p[1]-a[1],l=Math.hypot(dx,dy);return {a:{x:a[0],y:a[1]},b:{x:p[0],y:p[1]},dx,dy,l,nx:dy/l,ny:-dx/l}});let y=profiles[scene.selectedIndex][0][1];b={x:75,y:y-39,vx:0,vy:0,lean:0,facing:1};limbs=[0,1,2,3].map((i)=>({hand:i>1,p:{x:75+(i%2?7:-7),y:i>1?y-25:y},state:i>1?'free':'plant',t:0}));}function root(l){return {x:b.x+(l.hand?Math.sin(b.lean)*12:0)+(limbs.indexOf(l)%2?2:-2),y:b.y+(l.hand?-9:12)}}function nearest(p,e){let t=clamp(((p.x-e.a.x)*e.dx+(p.y-e.a.y)*e.dy)/(e.l*e.l),0,1);return{x:e.a.x+e.dx*t,y:e.a.y+e.dy*t,e}}function candidates(r,l,dir){let out=[];for(let e of edges){for(let t=0;t<=1;t+=1/Math.max(1,Math.ceil(e.l/5))){let p={x:e.a.x+e.dx*t,y:e.a.y+e.dy*t,e};if(dist(r,p)>(l.hand?27:26)||(!l.hand&&e.ny>-.35))continue;if(l.hand&&p.y>r.y+13)continue;out.push(p)}}return out.sort((a,c)=>score(c)-score(a));function score(p){return (p.x-r.x)*dir*.8+(l.hand?(r.y-p.y)*.6:-(Math.abs(p.y-r.y-19))*.6)-dist(r,p)*.1}}
function ground(x){let ys=edges.filter(e=>e.dx>0&&x>=e.a.x&&x<=e.b.x).map(e=>e.a.y+(x-e.a.x)*e.dy/e.dx);return ys.length?Math.min(...ys):null}
function tick(dt){let dir=Math.abs(input.x)>.12?Math.sign(input.x):b.facing||1;let active=Math.abs(input.x)>.12;b.facing=dir;let speed=active?input.x*30:0;let next=ground(b.x+dir*12),here=ground(b.x);if(next===null||here===null||next<here-27)speed=0;b.vx=mix(b.vx,speed,Math.min(1,dt*12));let nx=clamp(b.x+b.vx*dt,15,985);if(ground(nx)<here-27){nx=b.x;b.vx=0}b.x=nx;let feet=limbs.slice(0,2);let moving=Math.abs(b.vx)>1;let swing=feet.find(l=>l.state==='reach');if(!moving){b.stepClock=0}else{const period=clamp(13/Math.max(8,Math.abs(b.vx)),.32,.85);b.stepClock=(b.stepClock??period)+dt;if(!swing&&b.stepClock>=period){let l=feet[b.nextFoot??0];let x=clamp(b.x+dir*(Math.abs(b.vx)*period*.65+5),1,999),y=ground(x);if(y!==null&&Math.abs(y-here)<27){l.from={...l.p};l.to={x,y};l.t=0;l.state='reach';swing=l;b.nextFoot=1-(b.nextFoot??0);b.stepClock-=period;l.duration=period*.82;}}}if(swing){swing.t=clamp(swing.t+dt/(swing.duration||.25),0,1);let t=swing.t,u=t*t*(3-2*t);swing.p={x:mix(swing.from.x,swing.to.x,u),y:mix(swing.from.y,swing.to.y,u)-Math.sin(Math.PI*t)*6};let floor=ground(swing.p.x);if(floor!==null)swing.p.y=Math.min(swing.p.y,floor);if(t===1)swing.state='plant'}let samples=[ground(b.x-8),ground(b.x),ground(b.x+8)].filter(y=>y!==null);let base=samples.reduce((a,y)=>a+y,0)/samples.length;let target=base-35;let old=b.y;b.y=mix(b.y,target,Math.min(1,dt*12));b.vy=(b.y-old)/dt;b.lean=mix(b.lean,active?dir*.12:0,dt*8);for(let l of limbs.slice(2)){let rr=root(l),phase=(swing?swing.t:0)*Math.PI;let sign=limbs.indexOf(l)===2?1:-1;l.state='free';l.p={x:rr.x+dir*sign*Math.sin(phase)*6,y:rr.y+19}}jump=false;info.textContent='coordinated gait · feet '+feet.filter(l=>l.state==='plant').length+' · velocity '+b.vx.toFixed(0)+', '+b.vy.toFixed(0)}
function line(a,z,w,color){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(z.x,z.y);ctx.stroke()}function draw(){ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle='#18232b';ctx.fillRect(0,0,W,H);scale=Math.min(2,W/240);cam=mix(cam,b.x-W/scale*.45,.12);ctx.save();ctx.translate(-cam*scale,H*.62-b.y*scale*.35);ctx.scale(scale,scale);ctx.fillStyle='#777b68';ctx.beginPath();ctx.moveTo(edges[0].a.x,edges[0].a.y);edges.forEach(e=>ctx.lineTo(e.b.x,e.b.y));ctx.lineTo(1000,500);ctx.lineTo(0,500);ctx.fill();let hip={x:b.x,y:b.y+12},sh={x:b.x+Math.sin(b.lean)*12,y:b.y-9};for(let l of limbs){let r=root(l),p=l.p,dx=p.x-r.x,dy=p.y-r.y,d=Math.max(.01,Math.hypot(dx,dy)),L=l.hand?14:13,dd=Math.min(2*L-.01,d),h=Math.sqrt(L*L-dd*dd/4),u=dx/d,v=dy/d,sign=l.hand?b.facing:-b.facing,k={x:r.x+u*dd/2-v*h*sign,y:r.y+v*dd/2+u*h*sign},z={x:r.x+u*dd,y:r.y+v*dd};line(r,k,l.hand?5:7,l.hand?'#c5a58a':'#655b48');line(k,z,l.hand?4:6,l.hand?'#c5a58a':'#655b48');if(debug){ctx.fillStyle=l.state==='plant'?'#9cdb9a':l.state==='reach'?'#eac47d':'#b8b8b8';ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill()}}line(hip,sh,15,'#78927b');ctx.fillStyle='#c5a58a';ctx.beginPath();ctx.arc(sh.x,sh.y-9,7,0,7);ctx.fill();ctx.fillStyle='#51473c';ctx.beginPath();ctx.arc(sh.x+b.facing*4,sh.y-10,1.3,0,7);ctx.fill();if(debug){ctx.fillStyle='#efb15e';ctx.fillRect(b.x-2,b.y-2,4,4)}ctx.restore()}function resize(){W=innerWidth;H=innerHeight;C.width=W*devicePixelRatio;C.height=H*devicePixelRatio}onresize=resize;resize();reset();scene.onchange=reset;document.querySelector('#reset').onclick=reset;document.querySelector('#slow').onclick=()=>slow=!slow;document.querySelector('#debug').onclick=()=>debug=!debug;document.querySelector('#jump').onclick=()=>jump=true;let pad=document.querySelector('#pad'),knob=document.querySelector('#knob');function move(e){let r=pad.getBoundingClientRect();input.x=clamp((e.clientX-r.left-72)/48,-1,1);input.y=clamp((e.clientY-r.top-72)/48,-1,1);knob.style.transform='translate('+input.x*44+'px,'+input.y*44+'px)'}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);move(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))move(e)};pad.onpointerup=pad.onpointercancel=()=>{input={x:0,y:0};knob.style.transform='none'};let last=performance.now(),acc=0;function frame(t){acc+=Math.min(.05,(t-last)/1000)*(slow?.25:1);last=t;while(acc>=1/120){tick(1/120);acc-=1/120}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
